<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Nästa tenta</title>
<style>
@font-face{font-family:"Bebas Neue";src:url("../fonts/bebas-neue-latin-400-normal.woff2") format("woff2");font-display:block}
@font-face{font-family:Inter;font-weight:400;src:url("../fonts/inter-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:Inter;font-weight:600;src:url("../fonts/inter-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:Inter;font-weight:700;src:url("../fonts/inter-latin-700-normal.woff2") format("woff2")}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:transparent}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e3e3e3;font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden}
.card{position:absolute;inset:2px;border-radius:12px;padding:clamp(12px,6vh,20px) 18px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,#3a1512 0%,#1c1414 55%,#161616 100%);box-shadow:0 0 0 1px #3a2420;
  display:flex;flex-direction:column;justify-content:center}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.15em;color:#f08a82}
.big{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.num{font-family:"Bebas Neue",Impact,sans-serif;font-size:clamp(48px,30vh,80px);line-height:.9;color:#fff;text-shadow:0 0 22px rgba(255,60,50,.55)}
.unit{font-size:15px;font-weight:600}
.name{margin-top:8px;font-weight:600;color:#f2f2f2}
.info{font-size:12.5px;color:#c9afaa}
.track{margin-top:12px;height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#8e1b16,#e5453d);transition:width .6s ease}
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow" id="eyebrow">NÄSTA TENTA</div>
  <div class="big"><span class="num" id="num">–</span><span class="unit" id="unit">dagar kvar</span></div>
  <div class="name" id="name">&nbsp;</div>
  <div class="info" id="info">&nbsp;</div>
  <div class="track" aria-hidden="true"><div class="fill" id="fill"></div></div>
</div>
<script>
(function () {
  // Ändra i adressen: ?namn=...&datum=ÅÅÅÅ-MM-DD&info=...&fran=ÅÅÅÅ-MM-DD&rubrik=...
  var q = new URLSearchParams(location.search);
  var name = q.get('namn') || 'Databaser – salstenta';
  var info = q.has('info') ? q.get('info') : '5 h · öppen bok';
  var date = parse(q.get('datum') || '2026-11-17');
  var from = parse(q.get('fran') || '2026-08-31');
  if (q.get('rubrik')) document.getElementById('eyebrow').textContent = q.get('rubrik').toUpperCase();
  function parse(s) { var p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  var fmt = new Intl.DateTimeFormat('sv-SE', { weekday: 'long', day: 'numeric', month: 'long' });
  function draw() {
    var now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var d = Math.round((date - today) / 864e5);
    var num = document.getElementById('num'), unit = document.getElementById('unit');
    if (d > 1) { num.textContent = d; unit.textContent = 'dagar kvar'; }
    else if (d === 1) { num.textContent = '1'; unit.textContent = 'dag kvar'; }
    else if (d === 0) { num.textContent = 'IDAG'; unit.textContent = 'lycka till'; }
    else { num.textContent = 'KLAR'; unit.textContent = 'byt datum i adressen'; }
    document.getElementById('name').textContent = name;
    document.getElementById('info').textContent = fmt.format(date) + (info ? ' · ' + info : '');
    var p = Math.min(100, Math.max(0, 100 * (today - from) / (date - from)));
    document.getElementById('fill').style.width = p.toFixed(1) + '%';
  }
  draw();
  setInterval(draw, 3600000);
})();
</script>
</body>
</html>
