<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Klocka</title>
<style>
@font-face{font-family:"Bebas Neue";src:url("../fonts/bebas-neue-latin-400-normal.woff2") format("woff2");font-display:block}
@font-face{font-family:Inter;font-weight:400;src:url("../fonts/inter-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:Inter;font-weight:600;src:url("../fonts/inter-latin-600-normal.woff2") format("woff2")}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:transparent}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#d4d4d4;-webkit-font-smoothing:antialiased;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.wrap{width:100%;max-width:460px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:10px}
.tiles{display:flex;align-items:stretch;gap:8px;width:100%;
  height:min(calc(100vh - 44px),calc((100vw - 38px) / 2 * 1.08),240px)}
.tile{position:relative;flex:1;border-radius:10px;container-type:size;
  background:linear-gradient(180deg,#272727 0%,#1f1f1f 50%,#171717 50%,#131313 100%);
  box-shadow:inset 0 0 0 1px #2d2d2d,0 10px 22px rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile::after{content:"";position:absolute;left:7px;right:7px;top:50%;height:1px;background:#0a0a0a;box-shadow:0 1px 0 rgba(255,255,255,.04)}
.num{font-family:"Bebas Neue",Impact,sans-serif;font-size:66cqh;line-height:1;color:#f2f2f2;letter-spacing:.02em;
  transform:translateY(3%);transition:opacity .25s ease,transform .25s ease}
.num.out{opacity:0;transform:translateY(-6%)}
.lbl{position:absolute;bottom:6.5cqh;font-size:clamp(8px,7.5cqh,11px);font-weight:600;letter-spacing:.12em;color:#8a8a8a}
.lbl.l{left:8cqw}.lbl.r{right:8cqw;color:#e5453d}
.colon{flex:none;width:6px;display:flex;flex-direction:column;justify-content:center;gap:12px;align-items:center}
.colon i{width:5px;height:5px;border-radius:50%;background:#e5453d;box-shadow:0 0 8px #e5453d;transition:opacity .2s}
.colon.dim i{opacity:.35}
.hello{font-size:12.5px;color:#9b9b9b;letter-spacing:.01em}
</style>
</head>
<body>
<div class="wrap">
  <div class="tiles">
    <div class="tile"><span class="num" id="h">--</span><span class="lbl l" id="week">VECKA –</span></div>
    <div class="colon" id="colon" aria-hidden="true"><i></i><i></i></div>
    <div class="tile"><span class="num" id="m">--</span><span class="lbl r" id="day">&nbsp;</span></div>
  </div>
  <div class="hello" id="hello">&nbsp;</div>
</div>
<script>
(function () {
  var DAYS = ['SÖNDAG', 'MÅNDAG', 'TISDAG', 'ONSDAG', 'TORSDAG', 'FREDAG', 'LÖRDAG'];
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function isoWeek(d) {
    var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var day = t.getUTCDay() || 7;
    t.setUTCDate(t.getUTCDate() + 4 - day);
    var y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
    return Math.ceil(((t - y0) / 864e5 + 1) / 7);
  }
  function hello(h) {
    if (h >= 5 && h < 10) return 'God morgon, Kasper';
    if (h >= 10 && h < 12) return 'God förmiddag, Kasper';
    if (h >= 12 && h < 18) return 'God eftermiddag, Kasper';
    if (h >= 18 && h < 23) return 'God kväll, Kasper';
    return 'God natt, Kasper';
  }
  function set(id, value) {
    var el = document.getElementById(id);
    if (el.textContent === value) return;
    if (el.textContent === '--') { el.textContent = value; return; }
    el.classList.add('out');
    setTimeout(function () { el.textContent = value; el.classList.remove('out'); }, 250);
  }
  function draw() {
    var now = new Date();
    set('h', pad(now.getHours()));
    set('m', pad(now.getMinutes()));
    document.getElementById('week').textContent = 'VECKA ' + isoWeek(now);
    document.getElementById('day').textContent = DAYS[now.getDay()];
    document.getElementById('hello').textContent = hello(now.getHours());
    document.getElementById('colon').classList.toggle('dim', now.getSeconds() % 2 === 1);
  }
  draw();
  setTimeout(function () { draw(); setInterval(draw, 1000); }, 1000 - (Date.now() % 1000));
})();
</script>
</body>
</html>
